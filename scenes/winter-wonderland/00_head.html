<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Winter Wonderland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed 16:9 pixel-art stage centred in a night-sky frame; controls float at the edges. */
:root {
  --bg: #0b0d1c; --panel: rgba(16, 15, 30, .92); --ink: #f3e6c8; --accent: #f2c46d;
  --line: #57487a; --muted: #8b7bb0; --ok: #a8bb95; --btn: #2a2240; --field: #231d38;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
#wrap { height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
#out { display: block; max-width: 100%; image-rendering: pixelated; image-rendering: crisp-edges; background: var(--bg); }
#dbg { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 250px; max-width: calc(100% - 32px); max-height: calc(100% - 96px); overflow: auto; box-sizing: border-box;
  background: var(--panel); color: var(--ink); font: 11px/1.45 var(--mono); padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 18px rgba(0, 0, 0, .5); z-index: 3; }
#dbg h3 { margin: 0 0 6px; font-size: 12px; color: var(--accent); letter-spacing: .06em; }
#dbg label { display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
#dbg .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; margin: 6px 0; }
#dbg input[type=range] { width: 100%; }
#dbg input[type=text], #dbg input:not([type]) { background: var(--field); color: var(--ink); border: 1px solid var(--line); font: inherit; }
#dbg .row { margin: 5px 0; }
#dbg .stat { color: var(--ok); }
#dbg .keys { color: var(--muted); }
.ctl { font: 12px/1 var(--mono); letter-spacing: .04em; color: var(--ink); background: var(--btn);
  border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; cursor: pointer; }
.ctl:hover { border-color: var(--muted); }
a.ctl { text-decoration: none; display: inline-block; }
.ctl:focus-visible, #dbg button:focus-visible, #dbg input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#dbg button { font: inherit; color: var(--ink); background: var(--btn); border: 1px solid var(--muted); border-radius: 4px; padding: 2px 7px; margin: 2px 2px 2px 0; cursor: pointer; }
#bar { position: fixed; z-index: 4; display: flex; gap: 8px;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  opacity: 1; transition: opacity .6s ease; }
#bar.idle { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { #bar { transition: none; } }
</style>
<div id="wrap"><canvas id="out" width="1920" height="1080" aria-label="An animated pixel-art snowy valley below snow-capped mountains: children sled down a hill and build a snowman that a big dog knocks over, while a couple in rocking chairs sip cocoa on the porch of a warm log cabin and their orange tabby comes out through the cat flap to snuggle."></canvas></div>
<div id="dbg" hidden></div>
<div id="bar"><a class="ctl" href="../">World map</a><button class="ctl" id="bCtl" type="button">Controls</button><button class="ctl" id="bFull" type="button">Fullscreen</button></div>
<script>
