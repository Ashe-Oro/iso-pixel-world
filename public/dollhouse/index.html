<script>
/* ---- 01_core.js ---- */
'use strict';
/* =====================================================================
   RAINY NIGHT DOLLHOUSE — a living isometric pixel-art diorama
   ---------------------------------------------------------------------
   Pure JS + Canvas 2D, no external assets. Everything (architecture,
   furniture, characters, weather) is generated in code at startup.

   Rendering: a software 2:1 isometric rasterizer writes palette indices,
   per-pixel depth and world position into 640x360 buffers. Static scene
   is built once; each frame copies it, composites sky/windows/props/
   characters with depth testing, then resolves index + warm/cool light

   divide the 120 s loop; behaviour timelines are built from a seed.

/* ---------- deterministic hashing / RNG ---------- */

  vi0: '#231d38', vi1: '#342a4f', vi2: '#4c3f6e', vi3: '#6c5d93', vi4: '#9688ba', vi5: '#c2b8dc',

  bulb: '#fff2c4', bulb2: '#ffd98a', glow: '#f9c66a', glowR: '#ff8a7a', glowG: '#9fe88a', glowB: '#8ac8ff', glowP: '#e3a0ff',
  winL: '#f5b453', winL2: '#e08a35', star: '#fff6d8', ffly: '#d8ff7a', ffly2: '#8fdc5a', ember: '#ff9b3d', ember2: '#ffd36b',

/* ---------- lighting LUT: palette ramps by warm (0..7) & cool (0..3) ---------- */
const LV_B = [0.20, 0.30, 0.42, 0.56, 0.72, 0.88, 1.00, 1.10];
const LV_SH = [0.62, 0.50, 0.38, 0.26, 0.15, 0.06, 0.0, 0.0];

/* =====================================================================

/* ---- 03_bg.js ---- */
/* =====================================================================
   Background: night sky bands, moon + halo, tileable drifting clouds,
   misty hills with a sleeping town far below the floating island.
   ===================================================================== */
const BG = { skyList: null, clouds: [], townLights: [], car: null, boltX: 0, moon: { x: 548, y: 54, r: 11 } };

/* periodic (tileable in x) fbm noise on a lattice */

const tileFbm = (x, y, key) => tileNoise(x, y, IW, 48, key) * 0.55 + tileNoise(x, y, IW, 20, key + 1) * 0.3 + tileNoise(x, y, IW, 8, key + 2) * 0.15;

function buildSky() {
  const bands = [P.sky0, P.sky1, P.sky2, P.sky3, P.sky4, P.sky5, P.sky6];
  const top = 0, bot = 300;
  const { x: mx, y: my, r: mr } = BG.moon;
  for (let j = 0; j < IH; j++) for (let i = 0; i < IW; i++) {
    const p = j * IW + i;
    let f = clamp((j - top) / (bot - top), 0, 1) * (bands.length - 1);
    // subtle brightening near the moon
    const dm = Math.hypot(i - mx, (j - my) * 1.1);
    f += Math.max(0, 1.6 - dm / 60);
    f = clamp(f, 0, bands.length - 1);
    let k = Math.floor(f); const fr = f - k;
    if (fr * 16 > BAYER[(j & 3) * 4 + (i & 3)] + 0.5 && k < bands.length - 1) k++;
    let c = bands[k];
    if (dm < mr + 9 && dm >= mr) { const g = (mr + 9 - dm) / 9; if (g * 16 > BAYER[(j & 3) * 4 + (i & 3)]) c = g > 0.6 ? P.cl4 : P.moonG; }
    if (dm < mr) {
      // moon disc with soft craters
      const cr = hash3(i >> 1, j >> 1, 77) > 0.82 || (Math.hypot(i - mx + 4, j - my + 2) < 3.2) || (Math.hypot(i - mx - 3, j - my - 4) < 2.2);
      c = (i - mx) + (j - my) > mr * 0.9 ? P.moon2 : cr ? P.moon2 : P.moon;
    }
    S.idx[p] = c; S.flag[p] = F_SKY | F_EXT; S.room[p] = R_EXT; S.dep[p] = -1e8 - 10; S.nrm[p] = 4;
  }
  // stars, sparse, in clear gaps (twinkle handled per frame via hash)
  ART = mulberry32(4242);
  BG.stars = [];
  for (let k = 0; k < 70; k++) { const x = rndi(0, IW - 1), y = rndi(0, 150); BG.stars.push([x, y, ART()]); }
}

function buildHills() {
  // three ridge lines, each a periodic function of x, with mist bands between
  const ridge = (x, base, amp, k) => base - amp * (0.55 * Math.sin(x * 0.012 + k) + 0.3 * Math.sin(x * 0.031 + k * 2.1) + 0.15 * Math.sin(x * 0.09 + k * 0.7));
  const layers = [[262, 16, 1.3, P.hill1, P.hill2], [292, 14, 3.1, P.hill2, P.hill3], [322, 12, 5.2, P.hill3, P.vi0]];
  for (let L = 0; L < layers.length; L++) {
    const [base, amp, k, c0, c1] = layers[L];
    for (let i = 0; i < IW; i++) {
      const top = Math.round(ridge(i, base, amp, k));
      for (let j = Math.max(0, top); j < IH; j++) {
        const p = j * IW + i;
        let c = c0;
        if (j - top < 1) c = c1;            // faint moonlit rim
        S.idx[p] = c; S.flag[p] = F_EXT; S.dep[p] = -1e8 + L; S.room[p] = R_EXT; S.nrm[p] = 4;
      }
      // mist above each ridge (dither)

        if (S.flag[p] & F_SKY && g * 16 > BAYER[(j & 3) * 4 + (i & 3)] + 4) S.idx[p] = L === 0 ? P.sky6 : P.cl3; }
      // tree tufts

    }

  const clusters = [[60, 300, 34], [170, 318, 26], [470, 306, 40], [590, 326, 30], [330, 336, 22]];
  for (const [cx, cy, n] of clusters) for (let k = 0; k < n; k++) {
    const x = Math.round(cx + rnd(-22, 22) * (0.4 + ART())), y = Math.round(cy + rnd(-5, 7));
    if (x < 0 || x >= IW || y < 0 || y >= IH) continue;
    const p = y * IW + x; if (S.flag[p] & F_SKY) continue;

  }

  BG.road = []; for (let i = 0; i < IW; i++) BG.road.push(Math.round(345 - 6 * Math.sin(i * 0.014 + 0.6) - (i > 400 ? (i - 400) * 0.02 : 0)));
}

function buildClouds() {
  // two tileable layers: [Uint16 map, height, y0]
  const mk = (h, y0, key, thr, cols) => {
    const m = new Uint16Array(IW * h);

}

/* precompute the list of sky pixels after the house is drawn */

/* row of books standing on a shelf (boxes) along x, spines facing +y */
function booksX(x0, x1, y0, y1, z, hMax, seed) {
  let x = x0, k = 0; const r = mulberry32(seed);
  while (x < x1 - 0.6) {
    const w = r() < 0.2 ? 1.5 : 1, h = Math.round(hMax * (0.65 + r() * 0.35)), col = SP.bookCols[Math.floor(r() * SP.bookCols.length)];
    if (r() < 0.08 && x > x0 + 2) { x += 1; continue; }                     // gap
    const lean = r() < 0.07;
    OBJ = objNew();
    const xe = Math.min(x1, x + w);
    box(x, y0 + (r() < 0.3 ? 0.5 : 0), z, xe, y1, z + (lean ? h - 1 : h), {
      t: P.cr2,
      y: (u, v) => (v > h - 2.5 && v < h - 1.5) || (v > 1 && v < 2) ? P.gd2 : col,
      x: dk(col)
    });
    x = xe; k++;
  }
}
/* row of books along y on an X-facing shelf */
function booksY(x0, x1, y0, y1, z, hMax, seed) {
  let y = y1, r = mulberry32(seed);
  while (y > y0 + 0.6) {
    const w = r() < 0.2 ? 1.5 : 1, h = Math.round(hMax * (0.65 + r() * 0.35)), col = SP.bookCols[Math.floor(r() * SP.bookCols.length)];
    OBJ = objNew();
    box(x0, Math.max(y0, y - w), z, x1, y, z + h, { t: P.cr2, x: (u, v) => (v > h - 2.5 && v < h - 1.5) ? P.gd2 : col, y: dk(col) });
    y -= w;
  }
}
/* generic small leafy plant sprite (static) */
function plantSpr(w, h, seed, leafCols, stemCol) {
  const s = new Spr(w, h), r = mulberry32(seed);
  const n = Math.floor(w * h / 9);
  for (let k = 0; k < n; k++) {
    const a = -Math.PI / 2 + (r() - 0.5) * 2.6, len = (0.45 + r() * 0.55) * h * 0.85;
    const bx = w / 2, by = h - 1, ex = bx + Math.cos(a) * len * 0.7, ey = by + Math.sin(a) * len;
    s.line(bx, by, (bx + ex) / 2, (by + ey) / 2, stemCol);
    const lc = leafCols[Math.floor(r() * leafCols.length)];
    s.ell(ex, ey, 1.6 + r(), 1 + r() * 0.6, lc);
    s.px(ex - 0.5, ey - 0.5, lt(lc));
  }
  s.ax = Math.floor(w / 2); s.ay = h - 1;
  return s;
}

function lightContrib(L, x, y, z, n) {

  for (let p = 0; p < NPIX; p++) {

    const room = S.room[p], x = S.wx[p], y = S.wy[p], z = S.wz[p], n = S.nrm[p];
    if (n === 4) { S.warm[p] = 30; S.cool[p] = 70; continue; }       // hills / island underside

/* ---- 09_render.js ---- */
/* =====================================================================

function stampD(spr, wx, wy, wz, slope, lw, flip, extraDepth = 0) {

    for (let c = 0; c < spr.w; c++) { const col = spr.d[r * spr.w + c]; if (!col) continue;

}

function decalXD(spr, yLeft, x0, zTop, lw, rowShift) {

    for (let c = 0; c < spr.w; c++) { const col = spr.d[r * spr.w + c]; if (!col) continue;

function scheduleLightning() {

}

      const steps = Math.ceil(Math.max(Math.abs(nx - x), ny - y)); for (let s = 0; s <= steps; s++) { const px = Math.round(x + (nx - x) * s / steps), py = Math.round(y + (ny - y) * s / steps);

}

/* ---- window views ---- */
const PANECOL = {};

    stampD(spr, p.x, p.y, p.z, a.slope, lw, a.flip);

    if (a.zzz && FX.zzz) {
      const sx = isx(p.x, p.y) + (who === 'g' ? -2 : 4), sy = isy(p.x, p.y, p.z) - (who === 'g' ? 26 : 8);
      for (let k = 0; k < 3; k++) { const f = phase(t, 4.8, k / 3); if (f > 0.85) continue;
        const zs = who === 'g' && f > 0.35 ? PR.z : PR.zS, x = Math.round(sx + f * 7 + Math.sin(f * 6) * 1.5), y = Math.round(sy - f * 12);
        if (who !== 'g' && a.zzz < 1 && k > 0) continue;
        for (let r = 0; r < zs.h; r++) for (let c = 0; c < zs.w; c++) if (zs.d[r * zs.w + c]) dput(x + c, y + r, zs.d[r * zs.w + c], 1e6); }
    }
    if (a.mug && FX.steam) { const sx = isx(p.x, p.y) + 4, sy = isy(p.x, p.y, p.z) - 6;
      for (let k = 0; k < 6; k++) { const f = phase(t, 1.6, k / 6); const x = Math.round(sx + Math.sin(f * 7 + k) * 1.2 + f), y = Math.round(sy - f * 9); if (f < 0.85) dput(x, y, PR.steamCols[Math.min(2, Math.floor(f * 3))], 1e6, 210); } }
  }
}
function scheduleInfo(t) {
  const e = episodeFor(t), lt = localT(t);
  const a = s => s.walk ? s.mode : s.arc ? 'hop' : s.anim;
  return `ep ${CFG.loop ? 'loop' : Math.floor(t / LOOP)} v${e.ev.variant}<br>girl ${a(findSeg(e.G, lt))} · dog ${a(findSeg(e.D, lt))} · cat ${a(findSeg(e.C, lt))}`;
}

/* ---- 20_main.js ---- */
/* =====================================================================
   Boot, timing (real-time / fixed-step / loop), debug panel, keyboard.
   URL params: ?seed=N &loop=0|1 &debug=1 &speed=X &t=sec &fixed=1 &int=1
   ===================================================================== */
const STATE = { simT: CFG.t0, last: null, fpsT: 0, fpsN: 0, fps: 0, ms: 0, fixed: new URLSearchParams(location.search).get('fixed') === '1' };

function buildWorld() {
  buildSky(); buildHills(); buildClouds();
  buildIsland(); buildShell(); buildItems(); buildLiving(); buildKitchen(); buildUpstairs(); buildExterior();
  outlinePass(); finishSky(); bakeLights(); prepSkyLists(); prepPanes();
}
function reseed(seed) {
  CFG.seed = seed | 0 || 1;
  scheduleLightning();
  if (typeof buildSchedule === 'function') buildSchedule();
}
function fit() {
  const v = document.getElementById('out'), w = document.getElementById('wrap'), cs = getComputedStyle(w);
  const W = w.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = w.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.max(0.05, Math.min(W / 1920, H / 1080));
  if (CFG.intScale && s >= 1) s = Math.floor(s);
  v.style.width = Math.floor(1920 * s) + 'px'; v.style.height = Math.floor(1080 * s) + 'px';
}
function curT() { return CFG.loop ? ((STATE.simT % LOOP) + LOOP) % LOOP : STATE.simT; }

function tick(now) {
  if (STATE.last === null) STATE.last = now;
  let dt = (now - STATE.last) / 1000; STATE.last = now; if (dt > 0.25) dt = 0.25;
  if (!CFG.paused) STATE.simT += (STATE.fixed ? 1 / 60 : dt) * CFG.speed;
  const a = performance.now();
  renderFrame(curT());
  const ms = performance.now() - a;
  STATE.ms = STATE.ms * 0.9 + ms * 0.1; STATE.fpsN++; STATE.fpsT += dt;
  if (STATE.fpsT >= 0.5) { STATE.fps = STATE.fpsN / STATE.fpsT; STATE.fpsN = 0; STATE.fpsT = 0; if (CFG.debug) updateStats(); }
  requestAnimationFrame(tick);
}
/* frame-accurate capture hook: render a given time (seconds) synchronously */
window.renderAt = t => { CFG.paused = true; STATE.simT = t; renderFrame(curT()); return true; };
window.DOLLHOUSE = { CFG, FX, LOOP, renderAt: window.renderAt, reseed };

/* ---------------- debug panel ---------------- */
function buildDebug() {
  const el = document.getElementById('dbg');
  const fx = Object.keys(FX).map(k => `<label><input type="checkbox" data-fx="${k}" ${FX[k] ? 'checked' : ''}>${k}</label>`).join('');
  el.innerHTML = `<h3>DOLLHOUSE · CONTROLS</h3>
  <div class="row stat" id="dstat">…</div>
  <div class="row">speed <b id="dspv">${CFG.speed.toFixed(2)}</b>×<input type="range" id="dsp" min="0" max="8" step="0.05" value="${CFG.speed}"></div>
  <div class="row">time <b id="dtv">0</b>s<input type="range" id="dt" min="0" max="${LOOP}" step="0.05" value="0"></div>
  <div class="row"><button id="dpause">pause</button><button id="dloop"></button><button id="dstep">+1/60</button></div>
  <div class="row">seed <input id="dseed" type="text" inputmode="numeric" value="${CFG.seed}" style="width:70px"> <button id="dseedb">apply</button><button id="drand">random</button></div>
  <div class="row"><button id="dall">all on</button><button id="dnone">all off</button></div>
  <div class="grid">${fx}</div>
  <div class="row keys">Keys: D controls · L loop · space pause · ←/→ scrub · [ ] speed</div>`;
  const $ = id => document.getElementById(id);
  $('dsp').oninput = e => { CFG.speed = +e.target.value; $('dspv').textContent = CFG.speed.toFixed(2); };
  $('dt').oninput = e => { STATE.simT = +e.target.value; };
  $('dpause').onclick = () => { CFG.paused = !CFG.paused; syncDebug(); };
  $('dloop').onclick = () => { CFG.loop = !CFG.loop; syncDebug(); };
  $('dstep').onclick = () => { CFG.paused = true; STATE.simT += 1 / 60; syncDebug(); };
  $('dseedb').onclick = () => reseed(parseInt($('dseed').value, 10));
  $('drand').onclick = () => { const s = 1 + Math.floor(Math.random() * 99999); $('dseed').value = s; reseed(s); };
  $('dall').onclick = () => { for (const k in FX) FX[k] = 1; syncDebug(); };
  $('dnone').onclick = () => { for (const k in FX) FX[k] = 0; FX.characters = 1; FX.lighting = 1; FX.dither = 1; syncDebug(); };
  el.querySelectorAll('[data-fx]').forEach(cb => cb.onchange = e => { FX[e.target.dataset.fx] = e.target.checked ? 1 : 0; });
  syncDebug();
}
function syncDebug() {
  const el = document.getElementById('dbg'); el.hidden = !CFG.debug;
  const b = document.getElementById('bCtl'); if (b) b.textContent = CFG.debug ? 'Hide controls' : 'Controls';
  if (!CFG.debug) return;
  document.getElementById('dpause').textContent = CFG.paused ? 'play' : 'pause';
  document.getElementById('dloop').textContent = CFG.loop ? 'loop: 120s' : 'loop: off';
  el.querySelectorAll('[data-fx]').forEach(cb => { cb.checked = !!FX[cb.dataset.fx]; });
  updateStats();
}
function updateStats() {
  const t = curT(), s = document.getElementById('dstat'); if (!s) return;
  s.innerHTML = `fps ${STATE.fps.toFixed(0)} · frame ${STATE.ms.toFixed(2)}ms<br>t ${t.toFixed(2)}s · ${CFG.loop ? 'loop' : 'free'} · seed ${CFG.seed}<br>palette ${PAL.length} · ${typeof scheduleInfo === 'function' ? scheduleInfo(t) : ''}`;
  const dt = document.getElementById('dt'); if (dt && document.activeElement !== dt) { dt.max = CFG.loop ? LOOP : Math.max(LOOP, Math.ceil(STATE.simT / LOOP) * LOOP); dt.value = CFG.loop ? t : STATE.simT; document.getElementById('dtv').textContent = t.toFixed(1); }
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'range') return;
  if (e.key === 'd' || e.key === 'D') { CFG.debug = !CFG.debug; syncDebug(); }
  else if (e.key === 'l' || e.key === 'L') { CFG.loop = !CFG.loop; syncDebug(); }
  else if (e.key === ' ') { CFG.paused = !CFG.paused; syncDebug(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') STATE.simT += CFG.paused ? 1 / 60 : 1;
  else if (e.key === 'ArrowLeft') STATE.simT -= CFG.paused ? 1 / 60 : 1;
  else if (e.key === ']') { CFG.speed = Math.min(8, CFG.speed * 1.5); syncDebug(); }
  else if (e.key === '[') { CFG.speed = Math.max(0.05, CFG.speed / 1.5); syncDebug(); }
});
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('wrap'));

/* ---------------- viewer overlay: Controls + Fullscreen, fade out when idle ---------------- */
function setupOverlay() {
  const bar = document.getElementById('bar'), bFull = document.getElementById('bFull'), bCtl = document.getElementById('bCtl');
  let idleTimer = 0;
  const wake = () => { bar.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!bar.matches(':hover') && !bar.contains(document.activeElement)) bar.classList.add('idle'); }, 3200); };
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  bar.addEventListener('focusin', wake);
  wake();
  bCtl.onclick = () => { CFG.debug = !CFG.debug; syncDebug(); };
  const fsOK = document.fullscreenEnabled && document.documentElement.requestFullscreen;
  if (!fsOK) bFull.hidden = true;
  const syncFs = () => { bFull.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen'; };
  bFull.onclick = () => {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => { bFull.hidden = true; });
    } catch (e) { bFull.hidden = true; }
  };
  document.addEventListener('fullscreenchange', () => { syncFs(); fit(); });
  /* keep the screen awake while the scene plays (ignored where not allowed) */
  let lock = null;
  const askWake = () => { if (!navigator.wakeLock || document.visibilityState !== 'visible' || lock) return;
    navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {}); };
  document.addEventListener('visibilitychange', askWake); addEventListener('pointerdown', askWake, { passive: true }); askWake();
}

(function boot() {
  const t0 = performance.now();
  buildWorld();
  if (typeof initProps === 'function') initProps();
  if (typeof initCharacters === 'function') initCharacters();
  reseed(CFG.seed);
  buildLUT(); initOutput(); fit(); buildDebug();
  console.log('[dbg] world built in', Math.round(performance.now() - t0), 'ms; palette', PAL.length);
  setupOverlay();
  requestAnimationFrame(tick);
})();

</script>
