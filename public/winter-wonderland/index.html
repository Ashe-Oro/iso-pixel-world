const S = {

/* --- flat face rasterizer. t: 'T' top (z=z0), 'Y' plane y=y0 (+y facing), 'X' plane x=x0 (+x facing)

/* axis-aligned box: m = {t,y,x} shader or colour each (falsy = skip face) */
function box(x0, y0, z0, x1, y1, z1, m) {

/* plane rising along y: z = zA + s*(y - yA), for x in [x0,x1), y in [yA,yB) (visible if s<2) */

    const a = (i + 0.5 - OX) / 2, b = j + 0.5 - OY, xb = (a + b) / 2, yb = (b - a) / 2;

    }

    const dx = xb - cx, dy = yb - cy, A = 1 / (r * r) + 1 / (ry * ry), B = 2 * (dx / (r * r) + dy / (ry * ry)), Cc = dx * dx / (r * r) + dy * dy / (ry * ry) - 1;

/* height field: for every screen pixel, march the view ray (xb + t, yb + t, 2t) down from zMax to the

/* wall decal helpers: build shader stacks. Decal = {u0,v0,w,h,fn(col,row)} in face-pixel units

    else if (S.obj[q3] !== ob && d[q3] < dp - 3.5) hit = 1;

/* screen-aligned ground coordinates: u along the screen, v toward the camera */
const uvToX = (u, v) => (u + v) / Math.SQRT2, uvToY = (u, v) => (v - u) / Math.SQRT2;

/* =====================================================================
   Sky: palette-cycled gradient, a low winter sun, moon, stars, aurora and
   thin high cloud. All of it sits behind the mountains and the valley,
   so it only touches pixels flagged 1 in SKYM (2 = mountain).
   ===================================================================== */
const HORIZON = 175;
const SUN = { x: 70, y: 62, r: 16 };
const MOON_R = 11;

function bg(i, j, c) { if (i < 0 || j < 0 || i >= IW || j >= IH) return; const p = j * IW + i; if (SKYM[p] === 1) FR.idx[p] = c; }

const SKY_S = [0, 0.2, 0.4, 0.56, 0.68, 0.78, 0.87, 0.94, 1];
const SKY_KEYS = [
  [0.0, ['#3e5aa4', '#4f70b8', '#6c8cc8', '#92a8d4', '#bcc0d8', '#e2ccc8', '#f8d4b0', '#fde2b4', '#fff0cc']],
  [0.35, ['#2c3484', '#423c94', '#6a489c', '#9458a0', '#bc689c', '#e08290', '#f8a07c', '#fcbc80', '#ffdca4']],
  [0.68, ['#141c54', '#1e2868', '#2c327c', '#3e3c8a', '#584a94', '#745698', '#90649c', '#ac7c9c', '#c498a0']],
  [1.0, ['#0a1238', '#0e1a4a', '#14245c', '#1a2e6c', '#223a7a', '#2c4686', '#385490', '#48649a', '#5c78a6']]
];
const NB = 24;
function skyStop(s) { let k = 1; while (k < SKY_S.length - 1 && s > SKY_S[k]) k++; return [k, (s - SKY_S[k - 1]) / (SKY_S[k] - SKY_S[k - 1])]; }

const BANDQ = new Uint8Array((((NB - 1) * 16 + 2) * 16));

const GL = new Float32Array(IW * (IH + 110)), MG = new Float32Array(221 * 221);

/* after the static world is drawn: everything still empty is sky, then the ranges go on top of it */
function finishSky() {
  for (let p = 0; p < NPIX; p++) if (S.dep[p] < -1e8) { SKYM[p] = 1; S.flag[p] = F_SKY; }

  const arr = []; for (let p = 0; p < fill * IW; p++) if (SKYM[p] === 1 && ((p / IW) | 0) < CLOUDS.far.row[p % IW]) arr.push(p);

  for (let k = 0; k < SB.n; k++) { const p = SB.list[k], j = (p / IW) | 0, i = p - j * IW; SB.base[k] = SB.px[p]; SB.ba[k] = bay(i, j); SB.gi[k] = (j + 110) * IW + i; }

function drawSkyGlow(t) {
  const gk = 1 - smooth01(0.1, 0.8, CUR_N); if (gk <= 0.001) return;
  const off = Math.round(100 * sunSink(t)) * IW, L = SB.list, base = SB.base, ba = SB.ba, gi = SB.gi, n = SB.n, idx = FR.idx, m = (NB - 1) * 16;

const SUN_CORE = [['#ffe4a4', '#fff0c4', '#fff8e0', '#fffdf4'], ['#f07848', '#f88e58', '#fcaa70', '#ffc48c']];
const SUN_PAL = Array.from({ length: 9 }, (_, k) => SUN_CORE[0].map((c, i) => CE(mixHex(c, SUN_CORE[1][i], k / 8))));
const SUN_HALO = Array.from({ length: 9 }, (_, k) => CE(mixHex('#ffeec0', '#f8a070', k / 8)));
function drawSun(t) {
  const sink = sunSink(t); if (sink >= 1) return;
  const sy = SUN.y + Math.round(100 * sink), lv = Math.round(sink * 8), core = SUN_PAL[lv], halo = SUN_HALO[lv], r = SUN.r;
  for (let dy = -r - 7; dy <= r + 7; dy++) for (let dx = -r - 7; dx <= r + 7; dx++) {
    const d = Math.hypot(dx, dy), x = SUN.x + dx, y = sy + dy;
    if (d <= r) {
      const v = d > r - 1 ? 0 : 0.9 - 0.5 * (Math.hypot(dx + 5, dy + 5) / (r * 1.6));
      bg(x, y, core[clamp(Math.floor(v * 4 + bay(x, y) / 16), 0, 3)]);
    } else if (d <= r + 7 && 0.55 * (1 - (d - r) / 7) * 16 > bay(x, y)) bg(x, y, halo);
  }

/* the moon rises from behind the right-hand peaks during the blue hour */
function moonAt(t) {
  const m = (mod(t + EPS, LOOP) - 62) / 116;
  if (m <= 0 || m >= 1) return null;
  return { x: Math.round(lerp(590, 430, m)), y: Math.round(112 - 86 * Math.sin(Math.PI * m)), a: smooth01(0.45, 0.85, night(t)) };
}

function drawMoon(t) {
  const M = moonAt(t); if (!M || M.a <= 0 || !FX.moon) return;
  for (let y = 0; y < 221; y++) { const j = M.y + y - 110; if (j < 0 || j >= IH) continue;
    for (let x = 0; x < 221; x++) { const i = M.x + x - 110; if (i < 0 || i >= IW) continue; const p = j * IW + i; if (SKYM[p] !== 1 || j >= CLOUDS.far.fillY) continue;
      const g = MG[y * 221 + x] * M.a; if (g < 0.012) continue; FR.idx[p] = skyBand(1 - (1 - SB.px[p]) * (1 - g), bay(i, j)); } }
  const R_ = MOON_R;
  for (let dy = -R_ - 7; dy <= R_ + 7; dy++) for (let dx = -R_ - 7; dx <= R_ + 7; dx++) {
    const d = Math.hypot(dx, dy), x = M.x + dx, y = M.y + dy;
    if (d <= R_) {
      if (M.a * 16 <= bay(dx + 40, dy + 40)) continue;
      const crater = CRATERS.some(([cx, cy, r]) => (dx - cx) ** 2 + (dy - cy) ** 2 <= r * r);
      const v = 0.9 - 0.5 * Math.hypot(dx + 5, dy + 5) / (R_ * 1.8);
      bg(x, y, crater ? MOON_CR : MOON_LIT[clamp(Math.floor(v * 4 + bay(dx + 40, dy + 40) / 16 - 0.5), 0, 3)]);
    } else if (d <= R_ + 7 && M.a * 0.45 * (1 - (d - R_) / 7) > hash2(dx * 13 + 7, dy * 7 + 3)) bg(x, y, MOON_HALO);

/* stars come out from the top of the sky down as the light goes */
const STARS = (() => {
  const r = mulberry32(5), out = [];
  while (out.length < 230) out.push({ x: Math.floor(r() * IW), y: Math.floor(3 + r() * 130), P: [2, 3, 5, 6][Math.floor(r() * 4)], off: r(), b: 0.4 + r() * 0.6, big: r() > 0.93, th: 0.36 + r() * 0.5, cool: r() > 0.5 });

function drawStars(t) {
  if (!FX.stars) return;
  const N = CUR_N;
  for (const s of STARS) {
    const vis = smooth01(s.th, s.th + 0.15, N) * clamp((140 - s.y) / 50, 0, 1);
    if (vis <= 0) continue;
    const a = s.b * vis * (0.6 + 0.4 * wave(t, s.P, s.off));
    if (a < 0.25) continue;
    const dim = s.cool ? P.star3 : P.star2;
    bg(s.x, s.y, a > 0.5 ? P.star : dim);
    if (s.big && a > 0.6) { bg(s.x - 1, s.y, dim); bg(s.x + 1, s.y, dim); bg(s.x, s.y - 1, dim); bg(s.x, s.y + 1, dim); }
  }

  stampYeti(spr, x, y, z, flip);
  HEADS.yeti = [sx + (front ? 1 : flip ? -9 : 8), sy - 42];
  kidBreath(sx + (front ? 2 : flip ? -18 : 17), sy - 28, DEP(x, y, z) + 60, t, 5);
}

/* ---- the cardinal: lamp post, then the hat, then a hasty exit to the fairy-light pine ---- */
const CM_B = { r: '#d8342e', R: '#a02830', k: '#2a1a24', y: '#f4a040', e: '#180c14' };
const CARD_SIT = outl(smap(pad(['..r...', '.rrr..', 'kerry.', '.rrrr.', '..rRRR', '..y..y'.slice(0, 6)]), CM_B, 3, 7));
const CARD_FLY = [outl(smap(pad(['RR..RR', '.rrrr.', '.ekry.', '..r...']), CM_B, 3, 3)), outl(smap(pad(['......', 'RRrrRR', '.ekry.', '..r...']), CM_B, 3, 3))];
function drawCardinal(t, lt) {
  if (!FX.cardinal) return;
  const lamp = [Math.round(isx(LAMP_POST.x, LAMP_POST.y)), Math.round(isy(LAMP_POST.x, LAMP_POST.y, LAMP_POST.z)) - 10], hat = [Math.round(isx(SM.x, SM.y)) + 1, Math.round(isy(SM.x, SM.y, 0)) - 42], pine = [Math.round(isx(DECOR.x, DECOR.y)), Math.round(isy(DECOR.x, DECOR.y, 0)) - DECOR.h - 3];
  const fly = (a, b, u) => [Math.round(lerp(a[0], b[0], u)), Math.round(lerp(a[1], b[1], u) - 14 * Math.sin(Math.PI * u))], flap = CARD_FLY[phase(t, 0.2) < 0.5 ? 0 : 1];
  let pos, spr = CARD_SIT, flip = false;
  if (lt < 36) pos = lamp; else if (lt < 38) { pos = fly(lamp, hat, (lt - 36) / 2); spr = flap; flip = true; } else if (lt < T.CRASH) { pos = hat; flip = (lt % 3) < 1.5; }
  else if (lt < T.CRASH + 1.8) { pos = fly(hat, pine, (lt - T.CRASH) / 1.8); spr = flap; } else if (lt < 224) { pos = pine; flip = (lt % 9) < 3; } else if (lt < 226) { pos = fly(pine, lamp, (lt - 224) / 2); spr = flap; flip = true; } else pos = lamp;
  stampS2(spr, pos[0], pos[1], 3e4, AMB_W + 20, flip);
}

function drawCharacters(t) {
  const lt = mod(t, LOOP);
  drawRollTrails(t, lt); drawYetiTrail(t, lt); drawYeti(t, lt); drawFlap(lt, t); drawCouple(t, lt); drawCat(t, lt); drawSnowman(t, lt); drawDog(t, lt);
  drawSledFor('sledC', 'kc', 0, t, lt); drawSledFor('sledD', 'kd', 1, t, lt);
  for (const k of ['ka', 'kb', 'kc', 'kd']) drawKid(k, t, lt);
  drawCardinal(t, lt); drawVisitors(t, lt);
}
function scheduleInfo(t) { const lt = mod(t, LOOP), e = episodeFor(); return `A ${findSeg(e.ka, lt).anim} · B ${findSeg(e.kb, lt).anim} · dog ${findSeg(e.dog, lt).anim} · cat ${findSeg(e.cat, lt).anim}`; }

/* ---- emote bubbles ---- */
const ICONS = {
  bang: ['...x...', '...x...', '...x...', '...x...', '.......', '...x...', '.......'],
  heart: ['.xx.xx.', 'xxxxxxx', 'xxxxxxx', '.xxxxx.', '..xxx..', '...x...', '.......'],
  note: ['...xxx.', '...x.x.', '...x.x.', '...x...', '.xxx...', '.xxx...', '.......'],
  z: ['xxxxx..', '...x...', '..x....', '.x.....', 'xxxxx..', '.......', '.......'],
  dots: ['.......', '.......', 'x..x..x', '.......', '.......', '.......', '.......'],
  q: ['..xxx..', '.x...x.', '.....x.', '...xx..', '...x...', '.......', '...x...']
};
const ICON_C = { bang: CE('#e0403a'), heart: CE('#e8506a'), note: CE('#3e8a80'), z: CE('#6a6aa0'), dots: CE('#5a4058'), q: CE('#3a6ec8') }, BUB_W = CE('#fff6ea'), BUB_O = CE('#2e1a2c');
const BUBBLE_ROWS = ['..wwwwwwww..', '.wwwwwwwwww.', 'wwwwwwwwwwww', 'wwwwwwwwwwww', 'wwwwwwwwwwww', 'wwwwwwwwwwww', 'wwwwwwwwwwww', 'wwwwwwwwwwww', '.wwwwwwwwww.', '..wwwwwwww..', '...www......', '...ww.......', '...w........'];
function bubble(icon) {
  return cached('e' + icon, () => {
    const s = new Spr(14, 15); s.map(BUBBLE_ROWS, { w: BUB_W }, 1, 1);
    s.map(ICONS[icon], { x: ICON_C[icon] }, 3, 3); s.outline(() => BUB_O); s.ax = 4; s.ay = 14; return s;
  });
}
const POP = (() => { const s = new Spr(7, 7); s.rect(2, 2, 3, 3, BUB_W); s.outline(() => BUB_O); s.ax = 3; s.ay = 6; return s; })();
const EMOTES = [
  ['ka', 'heart', 0.4, 2.4], ['kd', 'note', 1.2, 2.2], ['dog', 'heart', 6, 2.2], ['woman', 'note', 18, 2.2], ['dog', 'note', 21, 1.6], ['cat', 'note', 12, 2],
  ['dog', 'bang', 38.6, 1.6], ['ka', 'bang', T.CRASH + 0.2, 1.8], ['kb', 'bang', T.CRASH + 0.4, 1.8], ['woman', 'note', T.CRASH + 1, 2.2], ['man', 'note', T.CRASH + 1.6, 2.2], ['dog', 'heart', 50.4, 2],
  ['ka', 'dots', 59.6, 2.2], ['kb', 'note', 60, 2], ['cat', 'heart', 37.4, 2.2], ['cat', 'heart', 44, 2.2], ['woman', 'heart', 50, 2.2],
  ...[56, 66, 76, 86, 96].map(s => ['cat', 'z', s, 2.4]), ['ka', 'note', 99.4, 2], ['kb', 'note', 99.8, 2], ['man', 'heart', 108, 2.2], ...[112, 122, 132, 142, 152, 162, 172, 182].map(s => ['cat', 'z', s, 2.4]),
  ['ka', 'note', 120, 2], ['kb', 'q', 145.4, 3], ['kb', 'heart', 157, 2.2], ['dog', 'heart', 158.6, 2.2], ['dog', 'heart', 174, 2.2], ['kb', 'note', 184.4, 2], ['man', 'heart', 186, 2.2], ['kc', 'bang', 205, 1.6],
  ['yeti', 'bang', T.CRASH + 0.6, 2.2], ['yeti', 'note', 88, 2.4], ['yeti', 'heart', 107, 2.4], ['ka', 'heart', T.HAT + 0.4, 2.4], ['kb', 'note', T.HAT + 0.8, 2.2], ['woman', 'heart', 232, 2.4], ['man', 'heart', 233, 2.4], ['dog', 'heart', 234, 2.2], ['kc', 'note', 231, 2.2]
];
function drawEmotes(t) {
  for (const [who, icon, t0, dur] of EMOTES) {
    const s = since(t, t0); if (s >= dur) continue;
    const h = HEADS[who]; if (!h) continue;
    stampS2(s < 0.12 || s > dur - 0.1 ? POP : bubble(icon), h[0] - 1, h[1] - 2 - (s > 0.6 ? 1 : 0), 3e6, AMB_W);
  }
}

/* ---- 20_main.js ---- */
/* =====================================================================
   Boot, timing (real-time / fixed-step / loop), debug panel, keyboard.
   URL params: ?seed=N &loop=0|1 &debug=1 &speed=X &t=sec &fixed=1 &int=1
   ===================================================================== */
const STATE = { simT: CFG.t0, last: null, fpsT: 0, fpsN: 0, fps: 0, ms: 0, fixed: new URLSearchParams(location.search).get('fixed') === '1' };

function buildWorld() {
  buildGround(); buildCabin(); buildPines();
  outlinePass(); bakeWindowMask(); finishSky(); bakeLights();
}
function reseed(seed) {
  CFG.seed = seed | 0 || 1;
  buildSchedule();
}
function fit() {
  const v = document.getElementById('out'), w = document.getElementById('wrap'), cs = getComputedStyle(w);
  const W = w.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = w.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.max(0.05, Math.min(W / 1920, H / 1080));
  if (CFG.intScale && s >= 1) s = Math.floor(s);
  v.style.width = Math.floor(1920 * s) + 'px'; v.style.height = Math.floor(1080 * s) + 'px';
}
function curT() { return CFG.loop ? ((STATE.simT % LOOP) + LOOP) % LOOP : STATE.simT; }

function tick(now) {
  if (STATE.last === null) STATE.last = now;
  let dt = (now - STATE.last) / 1000; STATE.last = now; if (dt > 0.25) dt = 0.25;
  if (!CFG.paused) STATE.simT += (STATE.fixed ? 1 / 60 : dt) * CFG.speed;
  const a = performance.now();
  renderFrame(curT());
  const ms = performance.now() - a;
  STATE.ms = STATE.ms * 0.9 + ms * 0.1; STATE.fpsN++; STATE.fpsT += dt;
  if (STATE.fpsT >= 0.5) { STATE.fps = STATE.fpsN / STATE.fpsT; STATE.fpsN = 0; STATE.fpsT = 0; if (CFG.debug) updateStats(); }
  requestAnimationFrame(tick);
}
/* frame-accurate capture hook: render a given time (seconds) synchronously */
window.renderAt = t => { CFG.paused = true; STATE.simT = t; renderFrame(curT()); return true; };
window.WINTERLAND = { CFG, FX, LOOP, renderAt: window.renderAt, reseed };

/* ---------------- debug panel ---------------- */
function buildDebug() {
  const el = document.getElementById('dbg');
  const fx = Object.keys(FX).map(k => `<label><input type="checkbox" data-fx="${k}" ${FX[k] ? 'checked' : ''}>${k}</label>`).join('');
  el.innerHTML = `<h3>WINTER WONDERLAND · CONTROLS</h3>
  <div class="row stat" id="dstat">…</div>
  <div class="row">speed <b id="dspv">${CFG.speed.toFixed(2)}</b>×<input type="range" id="dsp" min="0" max="8" step="0.05" value="${CFG.speed}"></div>
  <div class="row">time <b id="dtv">0</b>s<input type="range" id="dt" min="0" max="${LOOP}" step="0.05" value="0"></div>
  <div class="row"><button id="dpause">pause</button><button id="dloop"></button><button id="dstep">+1/60</button></div>
  <div class="row">seed <input id="dseed" type="text" inputmode="numeric" value="${CFG.seed}" style="width:70px"> <button id="dseedb">apply</button><button id="drand">random</button></div>
  <div class="row"><button id="dall">all on</button><button id="dnone">all off</button></div>
  <div class="grid">${fx}</div>
  <div class="row keys">Keys: D controls · L loop · space pause · ←/→ scrub · [ ] speed</div>`;
  const $ = id => document.getElementById(id);
  $('dsp').oninput = e => { CFG.speed = +e.target.value; $('dspv').textContent = CFG.speed.toFixed(2); };
  $('dt').oninput = e => { STATE.simT = +e.target.value; };
  $('dpause').onclick = () => { CFG.paused = !CFG.paused; syncDebug(); };
  $('dloop').onclick = () => { CFG.loop = !CFG.loop; syncDebug(); };
  $('dstep').onclick = () => { CFG.paused = true; STATE.simT += 1 / 60; syncDebug(); };
  $('dseedb').onclick = () => reseed(parseInt($('dseed').value, 10));
  $('drand').onclick = () => { const s = 1 + Math.floor(Math.random() * 99999); $('dseed').value = s; reseed(s); };
  $('dall').onclick = () => { for (const k in FX) FX[k] = 1; syncDebug(); };
  $('dnone').onclick = () => { for (const k in FX) FX[k] = 0; FX.characters = 1; FX.lighting = 1; FX.dither = 1; syncDebug(); };
  el.querySelectorAll('[data-fx]').forEach(cb => cb.onchange = e => { FX[e.target.dataset.fx] = e.target.checked ? 1 : 0; });
  syncDebug();
}
function syncDebug() {
  const el = document.getElementById('dbg'); el.hidden = !CFG.debug;
  const b = document.getElementById('bCtl'); if (b) b.textContent = CFG.debug ? 'Hide controls' : 'Controls';
  if (!CFG.debug) return;
  document.getElementById('dpause').textContent = CFG.paused ? 'play' : 'pause';
  document.getElementById('dloop').textContent = CFG.loop ? `loop: ${LOOP}s` : 'loop: off';
  el.querySelectorAll('[data-fx]').forEach(cb => { cb.checked = !!FX[cb.dataset.fx]; });
  updateStats();
}
function updateStats() {
  const t = curT(), s = document.getElementById('dstat'); if (!s) return;
  s.innerHTML = `fps ${STATE.fps.toFixed(0)} · frame ${STATE.ms.toFixed(2)}ms<br>t ${t.toFixed(2)}s · ${CFG.loop ? 'loop' : 'free'} · seed ${CFG.seed}<br>palette ${PAL.length} · ${scheduleInfo(t)}`;
  const dt = document.getElementById('dt'); if (dt && document.activeElement !== dt) { dt.max = CFG.loop ? LOOP : Math.max(LOOP, Math.ceil(STATE.simT / LOOP) * LOOP); dt.value = CFG.loop ? t : STATE.simT; document.getElementById('dtv').textContent = t.toFixed(1); }
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'range') return;
  if (e.key === 'd' || e.key === 'D') { CFG.debug = !CFG.debug; syncDebug(); }
  else if (e.key === 'l' || e.key === 'L') { CFG.loop = !CFG.loop; syncDebug(); }
  else if (e.key === ' ') { CFG.paused = !CFG.paused; syncDebug(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') STATE.simT += CFG.paused ? 1 / 60 : 1;
  else if (e.key === 'ArrowLeft') STATE.simT -= CFG.paused ? 1 / 60 : 1;
  else if (e.key === ']') { CFG.speed = Math.min(8, CFG.speed * 1.5); syncDebug(); }
  else if (e.key === '[') { CFG.speed = Math.max(0.05, CFG.speed / 1.5); syncDebug(); }
});
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('wrap'));

/* ---------------- viewer overlay: Controls + Fullscreen, fade out when idle ---------------- */
function setupOverlay() {
  const bar = document.getElementById('bar'), bFull = document.getElementById('bFull'), bCtl = document.getElementById('bCtl');
  let idleTimer = 0;
  const wake = () => { bar.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!bar.matches(':hover') && !bar.contains(document.activeElement)) bar.classList.add('idle'); }, 3200); };
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  bar.addEventListener('focusin', wake);
  wake();
  bCtl.onclick = () => { CFG.debug = !CFG.debug; syncDebug(); };
  const fsOK = document.fullscreenEnabled && document.documentElement.requestFullscreen;
  if (!fsOK) bFull.hidden = true;
  const syncFs = () => { bFull.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen'; };
  bFull.onclick = () => {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => { bFull.hidden = true; });
    } catch (e) { bFull.hidden = true; }
  };
  document.addEventListener('fullscreenchange', () => { syncFs(); fit(); });
  /* keep the screen awake while the scene plays (ignored where not allowed) */
  let lock = null;
  const askWake = () => { if (!navigator.wakeLock || document.visibilityState !== 'visible' || lock || document.documentElement.classList.contains('embed')) return;
    navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {}); };
  document.addEventListener('visibilitychange', askWake); addEventListener('pointerdown', askWake, { passive: true }); askWake();
}

(function boot() {
  const t0 = performance.now();
  buildWorld();
  initProps(); buildTrails();
  reseed(CFG.seed);
  initOutput(); fit(); buildDebug();
  console.log('[dbg] world built in', Math.round(performance.now() - t0), 'ms; palette', PAL.length);
  setupOverlay();
  requestAnimationFrame(tick);
})();

</script>
