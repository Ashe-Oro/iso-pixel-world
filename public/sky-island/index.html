/* ---- 02_raster.js ---- */
/* =====================================================================
   Software iso rasterizer (2:1), shared with the other scenes. World: x -> screen (+2,+1), y -> (-2,+1),
   z -> (0,-1). Depth toward camera = x + y + 2z. Static scene is built
   once into indexed buffers (+ per-pixel world position for lighting).
   ===================================================================== */
let OX = 322, OY = 160;
const isx = (x, y) => OX + 2 * (x - y);
const isy = (x, y, z) => OY + x + y - z;
const DEP = (x, y, z) => x + y + 2 * z;

/* pixel flags */
const F_SKY = 1, F_GRASS = 2, F_ROCK = 4, F_WATER = 32, F_NOOUT = 64;

const S = {
  idx: new Uint16Array(NPIX), dep: new Float32Array(NPIX).fill(-1e9), flag: new Uint8Array(NPIX),
  obj: new Uint16Array(NPIX), nrm: new Uint8Array(NPIX),
  wx: new Float32Array(NPIX), wy: new Float32Array(NPIX), wz: new Float32Array(NPIX)
};
let OBJ = 1, FLAG = 0;
const objNew = () => ++OBJ;
const FOOT = [];      // footprints for ground contact-shadow AO: [x0,y0,x1,y1,z,strength]
function foot(x0, y0, x1, y1, z = 0, s = 1) { FOOT.push([x0, y0, x1, y1, z, s]); }

function put(p, c, d, x, y, z, n) {
  if (d < S.dep[p] - 0.0005) return;
  S.idx[p] = c; S.dep[p] = d; S.obj[p] = OBJ; S.flag[p] = FLAG; S.nrm[p] = n;
  S.wx[p] = x; S.wy[p] = y; S.wz[p] = z;
}

/* --- flat face rasterizer. t: 'T' top (z=z0), 'Y' plane y=y0 (+y facing), 'X' plane x=x0 (+x facing)
   shader(u,v,x,y,z) -> palette index (0 = skip). u,v are local world units. --- */
function face(t, x0, y0, z0, U, V, sh) {
  let c;
  if (t === 'T') c = [[x0, y0, z0], [x0 + U, y0, z0], [x0 + U, y0 + V, z0], [x0, y0 + V, z0]];
  else if (t === 'Y') c = [[x0, y0, z0], [x0 + U, y0, z0], [x0 + U, y0, z0 + V], [x0, y0, z0 + V]];
  else c = [[x0, y0, z0], [x0, y0 + U, z0], [x0, y0 + U, z0 + V], [x0, y0, z0 + V]];
  let i0 = 1e9, i1 = -1e9, j0 = 1e9, j1 = -1e9;
  for (const q of c) { const a = isx(q[0], q[1]), b = isy(q[0], q[1], q[2]); i0 = Math.min(i0, a); i1 = Math.max(i1, a); j0 = Math.min(j0, b); j1 = Math.max(j1, b); }
  i0 = Math.max(0, Math.floor(i0) - 1); i1 = Math.min(IW - 1, Math.ceil(i1)); j0 = Math.max(0, Math.floor(j0) - 1); j1 = Math.min(IH - 1, Math.ceil(j1));
  const fixed = typeof sh === 'number', n = t === 'T' ? 0 : t === 'Y' ? 1 : 2;
  for (let j = j0; j <= j1; j++) {
    const bb = j + 0.5 - OY;
    for (let i = i0; i <= i1; i++) {
      const a = (i + 0.5 - OX) / 2;
      let x, y, z, u, v;
      if (t === 'T') { const b = bb + z0; x = (a + b) / 2; y = (b - a) / 2; z = z0; u = x - x0; v = y - y0; }
      else if (t === 'Y') { y = y0; x = a + y0; z = x + y0 - bb; u = x - x0; v = z - z0; }
      else { x = x0; y = x0 - a; z = x0 + y - bb; u = y - y0; v = z - z0; }
      if (u < 0 || u >= U || v < 0 || v >= V) continue;
      const col = fixed ? sh : sh(u, v, x, y, z);
      if (!col) continue;
      put(j * IW + i, col, x + y + 2 * z, x, y, z, n);
    }
  }
}
/* axis-aligned box: m = {t,y,x} shader or colour each (falsy = skip face) */
function box(x0, y0, z0, x1, y1, z1, m) {
  if (typeof m === 'number') m = { t: lt(m), y: m, x: dk(m) };
  if (m.t) face('T', x0, y0, z1, x1 - x0, y1 - y0, m.t);
  if (m.y) face('Y', x0, y1, z0, x1 - x0, z1 - z0, m.y);
  if (m.x) face('X', x1, y0, z0, y1 - y0, z1 - z0, m.x);
}
/* plane rising along y: z = zA + s*(y - yA), for x in [x0,x1), y in [yA,yB) (visible if s<2) */
function slopeY(x0, x1, yA, yB, zA, s, sh) {
  const pts = [[x0, yA], [x1, yA], [x1, yB], [x0, yB]];
  let i0 = 1e9, i1 = -1e9, j0 = 1e9, j1 = -1e9;
  for (const q of pts) { const z = zA + s * (q[1] - yA), a = isx(q[0], q[1]), b = isy(q[0], q[1], z); i0 = Math.min(i0, a); i1 = Math.max(i1, a); j0 = Math.min(j0, b); j1 = Math.max(j1, b); }
  i0 = Math.max(0, Math.floor(i0) - 1); i1 = Math.min(IW - 1, Math.ceil(i1)); j0 = Math.max(0, Math.floor(j0) - 1); j1 = Math.min(IH - 1, Math.ceil(j1));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const a = (i + 0.5 - OX) / 2, b = j + 0.5 - OY, xb = (a + b) / 2, yb = (b - a) / 2;
    const t = (zA + s * (yb - yA)) / (2 - s); const x = xb + t, y = yb + t, z = 2 * t;
    if (x < x0 || x >= x1 || y < yA || y >= yB) continue;
    const col = typeof sh === 'number' ? sh : sh(x - x0, y - yA, x, y, z); if (!col) continue;
    put(j * IW + i, col, x + y + 2 * z, x, y, z, 0);
  }
}
/* vertical cylinder (ray-cast). side(ang,v,x,y,z) top(r01,ang,x,y) */
function cyl(cx, cy, z0, r, h, side, top, ry) {
  ry = ry || r;
  const i0 = Math.max(0, Math.floor(isx(cx - r, cy + ry)) - 2), i1 = Math.min(IW - 1, Math.ceil(isx(cx + r, cy - ry)) + 2);
  const j0 = Math.max(0, Math.floor(isy(cx - r, cy - ry, z0 + h)) - 2), j1 = Math.min(IH - 1, Math.ceil(isy(cx + r, cy + ry, z0)) + 2);
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const a = (i + 0.5 - OX) / 2, b = j + 0.5 - OY, xb = (a + b) / 2, yb = (b - a) / 2;
    const zt = z0 + h, tt = zt / 2, dxT = (xb + tt - cx) / r, dyT = (yb + tt - cy) / ry;
    if (top && dxT * dxT + dyT * dyT <= 1) {
      const col = typeof top === 'number' ? top : top(Math.sqrt(dxT * dxT + dyT * dyT), Math.atan2(dyT, dxT), xb + tt, yb + tt);
      if (col) { put(j * IW + i, col, xb + yb + 2 * tt + 2 * zt, xb + tt, yb + tt, zt, 0); continue; }
    }
    // side: ((xb+t-cx)/r)^2 + ((yb+t-cy)/ry)^2 = 1
    const dx = xb - cx, dy = yb - cy, A = 1 / (r * r) + 1 / (ry * ry), B = 2 * (dx / (r * r) + dy / (ry * ry)), Cc = dx * dx / (r * r) + dy * dy / (ry * ry) - 1;
    const disc = B * B - 4 * A * Cc; if (disc < 0) continue;
    const t = (-B + Math.sqrt(disc)) / (2 * A), z = 2 * t;
    if (z < z0 || z >= zt) continue;
    const x = xb + t, y = yb + t, ang = Math.atan2((y - cy) / ry, (x - cx) / r);
    const col = typeof side === 'number' ? side : side(ang, z - z0, x, y, z); if (!col) continue;
    put(j * IW + i, col, x + y + 2 * z, x, y, z, 3);
  }
}
/* stamp a sprite as an upright billboard in world space (static scene) */
function stampS(spr, wx, wy, wz, slope = 0, flags) {
  const sx0 = Math.round(isx(wx, wy)) - spr.ax, sy0 = Math.round(isy(wx, wy, wz)) - spr.ay, d0 = DEP(wx, wy, wz);
  const oldF = FLAG; if (flags !== undefined) FLAG = flags;
  for (let r = 0; r < spr.h; r++) { const j = sy0 + r; if (j < 0 || j >= IH) continue;
    for (let c = 0; c < spr.w; c++) { const col = spr.d[r * spr.w + c]; if (!col) continue; const i = sx0 + c; if (i < 0 || i >= IW) continue;
      const h = spr.ay - r, dx = c - spr.ax;
      put(j * IW + i, col, d0 + 2 * h + slope * dx, wx + dx / 4, wy - dx / 4, wz + h, 3);
    } }
  FLAG = oldF;
}
/* wall decal helpers: build shader stacks. Decal = {u0,v0,w,h,fn(col,row)} in face-pixel units
   (1 column = 0.5 world units horizontally on Y/X faces, 1 row = 1 z unit). */
function layered(base, decals) {
  return (u, v, x, y, z) => {
    const col = Math.floor(u * 2), row = Math.floor(v);
    for (let k = decals.length - 1; k >= 0; k--) {
      const d = decals[k], cc = col - d.c0, rr = d.r1 - row;          // rr: rows from top of decal
      if (cc >= 0 && cc < d.w && rr >= 0 && rr < d.h) { const c = d.fn(cc, rr, u, v); if (c) return c; }
    }
    return typeof base === 'number' ? base : base(u, v, x, y, z);
  };
}
/* decal from a sprite: placed with its left column at wall-u (world) u0 and its top row at height vTop */
const decal = (spr, u0, vTop) => ({ c0: Math.round(u0 * 2), r1: Math.round(vTop) - 1, w: spr.w, h: spr.h, fn: (c, r) => spr.d[r * spr.w + c] });

/* silhouette outline pass: darken pixels whose neighbour lies well behind them */
function outlinePass() {
  const d = S.dep, o = new Uint16Array(S.idx);
  for (let j = 1; j < IH - 1; j++) for (let i = 1; i < IW - 1; i++) {
    const p = j * IW + i; if (S.flag[p] & (F_SKY | F_NOOUT)) continue; const dp = d[p]; if (dp < -1e8) continue;
    const ob = S.obj[p];
    const q1 = p - IW, q2 = p - 1, q3 = p + 1, q4 = p + IW;
    let hit = 0;
    if (S.obj[q1] !== ob && d[q1] < dp - 3.5) hit = 1;
    else if (S.obj[q2] !== ob && d[q2] < dp - 3.5) hit = 1;
    else if (S.obj[q3] !== ob && d[q3] < dp - 3.5) hit = 1;
    else if (S.obj[q4] !== ob && d[q4] < dp - 6) hit = 1;
    if (hit) o[p] = dk(S.idx[p], 2);
  }
  S.idx.set(o);
}

/* lathe: a parametric surface around the vertical axis, for the island's rock body.
   rad(a, d) -> radius at angle a (in screen-aligned u,v) and depth d below the rim, 0 ends the column.
   sh(a, d, i, j) -> palette index. Oversampled so no holes open up between samples. */
const uvToX = (u, v) => (u + v) / Math.SQRT2, uvToY = (u, v) => (v - u) / Math.SQRT2;
const xyToU = (x, y) => (x - y) / Math.SQRT2, xyToV = (x, y) => (x + y) / Math.SQRT2;
function lathe(z0, maxD, rad, sh) {
  const da = 0.0035, dd = 0.4;
  for (let a = -Math.PI / 2; a < Math.PI * 1.5; a += da) {     // the seam of the angle sits at the hidden back
    const ca = Math.cos(a), sa = Math.sin(a);
    for (let d = 0; d < maxD; d += dd) {
      const r = rad(a, d); if (r <= 0) break;
      const u = r * ca, v = r * sa, x = uvToX(u, v), y = uvToY(u, v), z = z0 - d;
      const i = Math.floor(isx(x, y)), j = Math.floor(isy(x, y, z));
      if (i < 0 || j < 0 || i >= IW || j >= IH) continue;
      const c = sh(a, d, i, j); if (c) put(j * IW + i, c, x + y + 2 * z, x, y, z, 3);
    }
  }
}

/* ---- 03_sky.js ---- */
/* =====================================================================
   Sky: palette-cycled gradient, sun glow, moon, stars, Milky Way, stratus
   wisps and shooting stars. All of it sits behind the static world, so it
   only ever touches pixels flagged in SKYM.
   ===================================================================== */
const SC = 5 / 3;                                   // art authored for the 384x216 view
const SX = x => (x - 58) * SC, SY = y => (y - 42) * SC;
const HORIZON = 188;
const SUN = { x: Math.round(SX(112)), y: Math.round(SY(173)), r: 21 };
const MOON_R = 13;
const SKYM = new Uint8Array(NPIX);                  // 1 where nothing static covers the background
function bg(i, j, c) { if (i < 0 || j < 0 || i >= IW || j >= IH) return; const p = j * IW + i; if (SKYM[p]) FR.idx[p] = c; }

const SKY_S = [0, 0.2, 0.4, 0.56, 0.68, 0.78, 0.87, 0.94, 1];
const SKY_KEYS = [
  [0.0, ['#1b1430', '#2c1b45', '#4c2558', '#782f60', '#a43f5f', '#cc5858', '#e97a51', '#f6a25c', '#fcd08a']],
  [0.35, ['#120e28', '#1c1640', '#2e1c50', '#4a2258', '#702a5a', '#983656', '#bc4a4c', '#d86448', '#ea8a52']],
  [0.65, ['#0a0c22', '#101632', '#182044', '#222a58', '#302f68', '#463872', '#5e4078', '#7a4c7e', '#94607e']],
  [1.0, ['#04061a', '#070a22', '#0a102c', '#0e1636', '#121c40', '#16224a', '#1c2a54', '#24345e', '#2e3e68']]
];
const NB = 24;
function skyStop(s) { let k = 1; while (k < SKY_S.length - 1 && s > SKY_S[k]) k++; return [k, (s - SKY_S[k - 1]) / (SKY_S[k] - SKY_S[k - 1])]; }
const SKYP = Array.from({ length: NB }, (_, b) => { const [k, u] = skyStop(b / (NB - 1)); return CK(SKY_KEYS.map(([n, h]) => [n, mixHex(h[k - 1], h[k], u)])); });
const skyHexAt = yWorld => { const [k, u] = skyStop(clamp(yWorld / HORIZON, 0, 1)), h = SKY_KEYS[0][1]; return mixHex(h[k - 1], h[k], u); };   // golden-hour sky, for hazing far things
/* band value in 1/16 steps + Bayer -> band, snapped so the gradient reads as flat bands with thin dithered edges */
const BANDQ = new Uint8Array((((NB - 1) * 16 + 2) * 16));
for (let v = 0; v < (NB - 1) * 16 + 2; v++) for (let b = 0; b < 16; b++) {
  const lv = v / 16, base = Math.floor(lv), f = clamp((lv - base - 0.5) * 1.8 + 0.5, 0, 1);
  BANDQ[v * 16 + b] = Math.min(NB - 1, base + (f * 16 > b + 0.5 ? 1 : 0));
}
const SB = { list: null, n: 0, base: null, ba: null, gi: null, px: null };
const GL = new Float32Array(IW * (IH + 80)), MG = new Float32Array(221 * 221);
const skyBand = (s, b) => SKYP[BANDQ[(Math.floor(clamp(s, 0, 1) * (NB - 1) * 16) << 4) | b]];

/* after the static world is drawn: everything still empty is sky */
function finishSky() {
  const arr = [], fill = CLOUDS.far.fillY + 8;
  for (let p = 0; p < NPIX; p++) if (S.dep[p] < -1e8) { SKYM[p] = 1; S.flag[p] = F_SKY; }
  for (let p = 0; p < fill * IW; p++) if (SKYM[p]) arr.push(p);
  SB.list = Int32Array.from(arr); SB.n = arr.length;
  SB.base = new Float32Array(SB.n); SB.ba = new Uint8Array(SB.n); SB.gi = new Int32Array(SB.n); SB.px = new Float32Array(NPIX);
  for (let p = 0; p < NPIX; p++) {
    if (!SKYM[p]) continue;
    const j = (p / IW) | 0, i = p - j * IW, s = Math.pow(clamp((42 + (j + 0.5) * 0.6) / HORIZON, 0, 1), 1.1);
    SB.px[p] = s; S.idx[p] = skyBand(s, bay(i, j));
    for (const L of CLOUD_ORDER) if (j >= L.row[i]) S.idx[p] = L.col[1];
  }
  const under = new Set(); for (let p = 0; p < fill * IW; p++) if (SKYM[p] && ((p / IW) | 0) >= CLOUDS.far.row[p % IW]) under.add(p);
  SB.list = SB.list.filter(p => !under.has(p)); SB.n = SB.list.length;
  for (let k = 0; k < SB.n; k++) { const p = SB.list[k], j = (p / IW) | 0, i = p - j * IW; SB.base[k] = SB.px[p]; SB.ba[k] = bay(i, j); SB.gi[k] = (j + 80) * IW + i; }
  for (let j = 0; j < IH + 80; j++) for (let i = 0; i < IW; i++) {
    const d = Math.hypot((i - SUN.x) * 0.75, (j - 80 - SUN.y) * 1.3);
    GL[j * IW + i] = 0.78 * Math.exp(-d / 43) + 0.4 * Math.exp(-d / 150);
  }
  for (let y = 0; y < 221; y++) for (let x = 0; x < 221; x++) MG[y * 221 + x] = 0.3 * Math.exp(-Math.hypot(x - 110, y - 110) / 40);
  buildMilkyWay();
}

function drawSkyGlow(t) {
  const gk = 1 - smooth01(0, 0.55, CUR_N); if (gk <= 0.001) return;
  const off = Math.round(60 * sunSink(t)) * IW, L = SB.list, base = SB.base, ba = SB.ba, gi = SB.gi, n = SB.n, idx = FR.idx, m = (NB - 1) * 16;
  for (let k = 0; k < n; k++) {
    const g = GL[gi[k] - off] * gk, s = 1 - (1 - base[k]) * (1 - (g > 1 ? 1 : g)), v = (s * m) | 0;
    idx[L[k]] = SKYP[BANDQ[(v << 4) | ba[k]]];
  }
}

const SUN_CORE = [['#ffd98c', '#ffe9ac', '#fff4cc', '#fffbea'], ['#e0583a', '#ec7444', '#f69458', '#ffb276']];
const SUN_PAL = Array.from({ length: 9 }, (_, k) => SUN_CORE[0].map((c, i) => CE(mixHex(c, SUN_CORE[1][i], k / 8))));
const SUN_HALO = Array.from({ length: 9 }, (_, k) => CE(mixHex('#ffe2a0', '#f08a5a', k / 8)));
function drawSun(t) {
  const sink = sunSink(t); if (sink >= 1) return;
  const sy = SUN.y + Math.round(60 * sink), lv = Math.round(sink * 8), core = SUN_PAL[lv], halo = SUN_HALO[lv], r = SUN.r;
  for (let dy = -r - 7; dy <= r + 7; dy++) for (let dx = -r - 7; dx <= r + 7; dx++) {
    const d = Math.hypot(dx, dy), x = SUN.x + dx, y = sy + dy;
    if (d <= r) {
      const v = d > r - 1 ? 0 : 0.9 - 0.5 * (Math.hypot(dx + 6, dy + 6) / (r * 1.6));
      bg(x, y, core[clamp(Math.floor(v * 4 + bay(x, y) / 16 - 0.5 + 0.5), 0, 3)]);
    } else if (d <= r + 7 && 0.55 * (1 - (d - r) / 7) * 16 > bay(x, y)) bg(x, y, halo);
  }
}

/* the full moon rises from the right-hand cloud horizon, arcs overhead and sets on the left */
function moonAt(t) {
  const m = (mod(t + EPS, LOOP) - 75) / 150;
  if (m <= 0 || m >= 1) return null;
  return { x: Math.round(SX(lerp(440, 90, m))), y: Math.round(SY(206 - 150 * Math.sin(Math.PI * m))), a: smooth01(0.5, 0.8, night(t)) };
}
const MOON_LIT = ['#aeaab0', '#d0ccc4', '#ebe7da', '#fbf8ee'].map(CE), MOON_CR = CE('#bab4ac'), MOON_HALO = CE('#6c78aa');
const CRATERS = [[-5, -3, 2.6], [3, 2, 3.6], [-2, 7, 2], [7, -7, 1.7], [-7, 4, 1.2]];
function drawMoon(t) {
  const M = moonAt(t); if (!M || M.a <= 0 || !FX.moon) return;
  /* glow lifts the gradient around the disc */
  for (let y = 0; y < 221; y += 1) { const j = M.y + y - 110; if (j < 0 || j >= IH) continue;
    for (let x = 0; x < 221; x++) { const i = M.x + x - 110; if (i < 0 || i >= IW) continue; const p = j * IW + i; if (!SKYM[p] || j >= CLOUDS.far.fillY) continue;
      const g = MG[y * 221 + x] * M.a; if (g < 0.012) continue; FR.idx[p] = skyBand(1 - (1 - SB.px[p]) * (1 - g), bay(i, j)); } }
  const R_ = MOON_R;
  for (let dy = -R_ - 7; dy <= R_ + 7; dy++) for (let dx = -R_ - 7; dx <= R_ + 7; dx++) {
    const d = Math.hypot(dx, dy), x = M.x + dx, y = M.y + dy;
    if (d <= R_) {
      if (M.a * 16 <= bay(dx + 40, dy + 40)) continue;
      const crater = CRATERS.some(([cx, cy, r]) => (dx - cx) ** 2 + (dy - cy) ** 2 <= r * r);
      const v = 0.9 - 0.5 * Math.hypot(dx + 5, dy + 5) / (R_ * 1.8);
      bg(x, y, crater ? MOON_CR : MOON_LIT[clamp(Math.floor(v * 4 + bay(dx + 40, dy + 40) / 16 - 0.5), 0, 3)]);
    } else if (d <= R_ + 7 && M.a * 0.45 * (1 - (d - R_) / 7) > hash2(dx * 13 + 7, dy * 7 + 3)) bg(x, y, MOON_HALO);
  }
}

/* a few early stars high up at dusk, then the whole night sky fills in star by star */
const STARS = (() => {
  const r = mulberry32(5), out = [], bottom = SY(196);
  while (out.length < 26) out.push({ x: Math.floor(r() * IW), y: Math.floor(3 + r() * 90), P: [2, 3, 5, 6][Math.floor(r() * 4)], off: r(), b: 0.45 + r() * 0.55, big: r() > 0.85, early: true });
  while (out.length < 300) out.push({ x: Math.floor(r() * IW), y: Math.floor(3 + r() * (bottom - 10)), P: [2, 3, 5, 6][Math.floor(r() * 4)], off: r(), b: 0.4 + r() * 0.6, big: r() > 0.93, th: 0.4 + r() * 0.5, cool: r() > 0.5 });
  return out;
})();
function drawStars(t) {
  if (!FX.stars) return;
  const N = CUR_N, bottom = SY(196);
  for (const s of STARS) {
    const vis = s.early ? Math.max(clamp(1.25 - s.y / 83, 0, 1), N) : smooth01(s.th, s.th + 0.15, N) * clamp((bottom - s.y) / 50, 0, 1);
    if (vis <= 0) continue;

  requestAnimationFrame(tick);
}

  if (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'range') return;
  if (e.key === 'd' || e.key === 'D') { CFG.debug = !CFG.debug; syncDebug(); }
  else if (e.key === 'l' || e.key === 'L') { CFG.loop = !CFG.loop; syncDebug(); }
  else if (e.key === ' ') { CFG.paused = !CFG.paused; syncDebug(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') STATE.simT += CFG.paused ? 1 / 60 : 1;
  else if (e.key === 'ArrowLeft') STATE.simT -= CFG.paused ? 1 / 60 : 1;
  else if (e.key === ']') { CFG.speed = Math.min(8, CFG.speed * 1.5); syncDebug(); }
  else if (e.key === '[') { CFG.speed = Math.max(0.05, CFG.speed / 1.5); syncDebug(); }
});
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById('wrap'));

/* ---------------- viewer overlay: Controls + Fullscreen, fade out when idle ---------------- */
function setupOverlay() {
  const bar = document.getElementById('bar'), bFull = document.getElementById('bFull'), bCtl = document.getElementById('bCtl');
  let idleTimer = 0;
  const wake = () => { bar.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!bar.matches(':hover') && !bar.contains(document.activeElement)) bar.classList.add('idle'); }, 3200); };
  ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
  bar.addEventListener('focusin', wake);
  wake();
  bCtl.onclick = () => { CFG.debug = !CFG.debug; syncDebug(); };
  const fsOK = document.fullscreenEnabled && document.documentElement.requestFullscreen;
  if (!fsOK) bFull.hidden = true;
  const syncFs = () => { bFull.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen'; };
  bFull.onclick = () => {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => { bFull.hidden = true; });
    } catch (e) { bFull.hidden = true; }
  };
  document.addEventListener('fullscreenchange', () => { syncFs(); fit(); });
  /* keep the screen awake while the scene plays (ignored where not allowed) */
  let lock = null;
  const askWake = () => { if (!navigator.wakeLock || document.visibilityState !== 'visible' || lock || document.documentElement.classList.contains('embed')) return;
    navigator.wakeLock.request('screen').then(l => { lock = l; l.addEventListener('release', () => { lock = null; }); }).catch(() => {}); };
  document.addEventListener('visibilitychange', askWake); addEventListener('pointerdown', askWake, { passive: true }); askWake();
}

(function boot() {
  const t0 = performance.now();
  buildWorld();
  initProps();
  reseed(CFG.seed);
  initOutput(); fit(); buildDebug();
  console.log('[dbg] world built in', Math.round(performance.now() - t0), 'ms; palette', PAL.length);
  setupOverlay();
  requestAnimationFrame(tick);
})();

</script>
